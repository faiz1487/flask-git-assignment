<h2>Add To-Do Item</h2>
<form method="POST" action="/submittodoitem">
  <input type="text" name="itemName" placeholder="Item Name" required><br><br>
  <textarea name="itemDescription" placeholder="Item Description" required></textarea><br><br>
  <button type="submit">Add</button>
</form>
<input type="number" name="itemId" placeholder="Item ID"><br><br>
<input type="text" name="itemUUID" placeholder="Item UUID"><br><br>
<input type="text" name="itemHash" placeholder="Item Hash"><br><br>
